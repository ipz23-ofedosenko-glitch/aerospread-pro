<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мої проекти - AeroSpread Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@300;500;700&display=swap');
        
        :root {
            --primary-bg: #0a0e1a;
            --secondary-bg: #1a1f3a;
            --tertiary-bg: #16213e;
            --accent: #00d4ff;
            --accent-secondary: #ff6b00;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --border: #233554;
            --success: #64ffda;
            --danger: #ff5555;
            --warning: #ffab00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border);
            padding: 1.5rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            flex: 1;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .header-btn {
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--border);
            background: var(--tertiary-bg);
            color: var(--text-primary);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }

        .header-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.05);
        }

        .header-btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border: none;
            color: var(--primary-bg);
            font-weight: 600;
        }

        .header-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--secondary-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .filter-group {
            flex: 1;
        }

        .filter-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-input {
            width: 100%;
            padding: 0.5rem 1rem;
            background: var(--tertiary-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .stats {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--secondary-bg);
            border: 2px dashed var(--border);
            border-radius: 16px;
            margin-top: 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .empty-btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: var(--primary-bg);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .empty-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .project-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.1);
            transform: translateY(-4px);
        }

        .project-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--tertiary-bg);
        }

        .project-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .project-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .project-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .project-info {
            margin-bottom: 1rem;
            flex: 1;
        }

        .project-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding: 0.75rem;
            background: var(--tertiary-bg);
            border-radius: 8px;
            font-size: 0.9rem;
        }


        .project-label {
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .project-value {
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .project-value.high {
            color: var(--warning);
        }

        .project-value.danger {
            color: var(--danger);
        }

        .result-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        .location-info {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--tertiary-bg);
            border-radius: 8px;
            border-left: 3px solid var(--accent);
        }

        .location-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .location-coords {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent);
        }

        .project-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .project-btn {
            flex: 1;
            padding: 0.75rem 0.5rem;
            border: 1px solid var(--border);
            background: var(--tertiary-bg);
            color: var(--text-primary);
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 500;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.1);
            color: var(--accent);
        }

        .project-btn.delete {
            background: rgba(255, 85, 85, 0.05);
            border-color: var(--danger);
            color: var(--danger);
        }

        .project-btn.delete:hover {
            background: rgba(255, 85, 85, 0.15);
        }

        .project-btn.export {
            background: rgba(100, 255, 218, 0.05);
            border-color: var(--success);
            color: var(--success);
        }

        .project-btn.export:hover {
            background: rgba(100, 255, 218, 0.15);
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--secondary-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--success);
            border-radius: 8px;
            color: var(--text-primary);
            z-index: 1000;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }

        .notification.error {
            border-left-color: var(--danger);
        }

        .notification.warning {
            border-left-color: var(--warning);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .container {
                padding: 1rem;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .project-actions {
                flex-direction: column;
            }

            .project-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <a href="dashboard.html" class="back-link">← Назад до меню</a>
                <h1 class="page-title">Мої проекти</h1>
                <p class="page-subtitle">Усі розраховані моделі розповсюдження забруднення</p>
            </div>
            <div>
                <a href="parameters.html" class="header-btn primary">➕ Новий розрахунок</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="filters" id="filtersContainer" style="display: none;">
            <div class="filter-group">
                <label class="filter-label">Пошук за назвою</label>
                <input type="text" id="searchInput" class="filter-input" placeholder="Введіть назву проекту...">
            </div>
            <div class="filter-group">
                <label class="filter-label">Сортування</label>
                <select id="sortInput" class="filter-input">
                    <option value="newest">Найновіші</option>
                    <option value="oldest">Найстарші</option>
                    <option value="name">За назвою (А-Я)</option>
                    <option value="concentration">За концентрацією (спад)</option>
                </select>
            </div>
        </div>

        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <div class="loading-text">Завантаження проектів...</div>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📊</div>
            <h2 class="empty-title">Немає проектів</h2>
            <p class="empty-text">Запустіть новий розрахунок моделювання розповсюдження забруднення аерозолями</p>
            <a href="parameters.html" class="empty-btn">Створити перший проект</a>
        </div>

        <div id="noResultsState" class="no-results" style="display: none;">
            Проектів не знайдено за вашим пошуком
        </div>

        <div id="projectsContainer" class="projects-grid" style="display: none;"></div>
    </div>

    <div id="notificationContainer"></div>

    <script>
        let allProjects = [];
        let filteredProjects = [];

        window.addEventListener('DOMContentLoaded', async function() {
            const token = localStorage.getItem('token');
            if (!token) {
                showNotification('Будь ласка, увійдіть до системи', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return;
            }
            await loadProjects();
            setupEventListeners();
        });

        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            const sortInput = document.getElementById('sortInput');

            if (searchInput) {
                searchInput.addEventListener('input', filterAndDisplayProjects);
            }
            if (sortInput) {
                sortInput.addEventListener('change', filterAndDisplayProjects);
            }
        }

        async function loadProjects() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/simulation/results', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    allProjects = await response.json();
                    console.log('✅ Проекти завантажені:', allProjects);
                    filterAndDisplayProjects();
                } else if (response.status === 401) {
                    showNotification('Сеанс закінчився. Увійдіть знову', 'error');
                    window.location.href = 'index.html';
                } else {
                    showEmpty();
                }
            } catch (error) {
                console.error('Помилка завантаження проектів:', error);
                showNotification('Помилка підключення до сервера', 'error');
                showEmpty();
            }
        }

        function filterAndDisplayProjects() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const sortType = document.getElementById('sortInput').value;

            filteredProjects = allProjects.filter(project => {
                const name = (project.project_name || 'Проект').toLowerCase();
                return name.includes(searchQuery);
            });

            filteredProjects.sort((a, b) => {
                switch (sortType) {
                    case 'newest':
                        return new Date(b.calculation_date) - new Date(a.calculation_date);
                    case 'oldest':
                        return new Date(a.calculation_date) - new Date(b.calculation_date);
                    case 'name':
                        return (a.project_name || 'Проект').localeCompare(b.project_name || 'Проект');
                    case 'concentration':
                        return (b.max_concentration || 0) - (a.max_concentration || 0);
                    default:
                        return 0;
                }
            });

            displayProjects();
        }

        function displayProjects() {
            document.getElementById('loadingState').style.display = 'none';

            if (allProjects.length === 0) {
                showEmpty();
                return;
            }

            if (filteredProjects.length === 0) {
                document.getElementById('filtersContainer').style.display = 'flex';
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('noResultsState').style.display = 'block';
                document.getElementById('projectsContainer').style.display = 'none';
                return;
            }

            document.getElementById('filtersContainer').style.display = 'flex';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('noResultsState').style.display = 'none';

            const container = document.getElementById('projectsContainer');
            container.style.display = 'grid';
            container.innerHTML = filteredProjects.map(project => createProjectCard(project)).join('');
        }

        function createProjectCard(project) {
            const calcDate = project.calculation_date 
                ? new Date(project.calculation_date).toLocaleString('uk-UA')
                : 'Невідома дата';

            const maxConc = parseFloat(project.max_concentration) || 0;
            const maxDist = parseFloat(project.max_distance) || 0;
            const dangerRadius = parseFloat(project.danger_radius) || 0;
            const latitude = parseFloat(project.latitude) || 0;
            const longitude = parseFloat(project.longitude) || 0;

            const concClass = maxConc > 1000 ? 'danger' : (maxConc > 100 ? 'high' : '');

            return `
                <div class="project-card" data-project-id="${project.id}">
                    <div class="project-header">
                        <div class="project-name">${escapeHtml(project.project_name || 'Проект')}</div>
                        <div class="project-date">📅 ${calcDate}</div>
                        <div class="result-badge">✓ Розрахунок завершено</div>
                    </div>

                    <div class="project-content">
                        <div class="project-info">
                            <div class="project-info-row">
                                <div class="project-label">Речовина</div>
                                <div class="project-value">${project.substance_name || '—'}</div>
                            </div>
                            <div class="project-info-row">
                                <div class="project-label">Макс. концентрація</div>
                                <div class="project-value ${concClass}">${maxConc.toFixed(6)} мг/м³</div>
                            </div>
                        </div>

                        ${latitude && longitude ? `
                            <div class="location-info">
                                <div class="location-label">📍 Локація</div>
                                <div class="location-coords">${latitude.toFixed(5)}, ${longitude.toFixed(5)}</div>
                            </div>
                        ` : ''}

                        <div class="project-actions">
                            <button class="project-btn" onclick="viewProject(${project.id})" title="Переглянути">📊</button>
                            <button class="project-btn delete" onclick="deleteProject(${project.id})" title="Видалити">🗑️</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        async function viewProject(projectId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/simulation/results/${projectId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const project = await response.json();
                    localStorage.setItem('viewingProject', JSON.stringify(project));
                    window.location.href = 'calculation.html?view=' + projectId;
                } else if (response.status === 404) {
                    showNotification('Проект не знайдено', 'error');
                } else {
                    showNotification('Помилка завантаження проекту', 'error');
                }
            } catch (error) {
                console.error('Помилка при завантаженні проекту:', error);
                showNotification('Помилка підключення до сервера', 'error');
            }
        }

        async function deleteProject(projectId) {
            if (!confirm('Ви впевнені, що хочете видалити цей проект? Це неможливо буде скасувати.')) {
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`/api/simulation/results/${projectId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showNotification('✅ Проект успішно видалено', 'success');
                    await loadProjects();
                } else if (response.status === 404) {
                    showNotification('Проект не знайдено', 'error');
                } else {
                    showNotification('Помилка при видаленні проекту', 'error');
                }
            } catch (error) {
                console.error('Помилка при видаленні:', error);
                showNotification('Помилка підключення до сервера', 'error');
            }
        }

        function showEmpty() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('filtersContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('noResultsState').style.display = 'none';
            document.getElementById('projectsContainer').style.display = 'none';
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = 'notification ' + type;
            notification.textContent = message;
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(400px)';
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
